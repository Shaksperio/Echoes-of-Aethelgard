<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Echoes of Aethelgard — 3D Prototype</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="ui">
    <div id="title-screen">
      <div class="title-content">
        <p class="pre-title">Protótipo 3D · Arcane-Punk</p>
        <h1>Echoes of Aethelgard</h1>
        <p class="subtitle">Sylvan Keep — Hall de Entrada. Clique para jogar.</p>
        <button id="start-btn">Entrar no Keep</button>
        <div class="controls-box">
          <p><strong>WASD</strong> Mover &nbsp;|&nbsp; <strong>Espaço</strong> Pular &nbsp;|&nbsp; <strong>Shift</strong> Dash</p>
          <p><strong>Clique / F</strong> Atacar &nbsp;|&nbsp; <strong>E</strong> Salvar &nbsp;|&nbsp; <strong>Mouse</strong> Olhar</p>
        </div>
        <p style="margin-top:1.5rem;font-size:.75rem;color:#5a6a80"><a href="../" style="color:#8aa0c0">← Voltar ao jogo 2D</a></p>
      </div>
    </div>

    <div id="hud" class="hidden">
      <div class="bars">
        <div class="bar-label">Vida</div>
        <div id="health-bar"><div id="health-fill"></div></div>
        <div class="bar-label">Éter</div>
        <div id="ether-bar"><div id="ether-fill"></div></div>
      </div>
      <div id="ability-hint">Dash disponível</div>
      <div id="location-name">Hall de Entrada — Sylvan Keep</div>
    </div>

    <div id="crosshair" class="hidden">+</div>
  </div>

  <canvas id="game-canvas"></canvas>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
